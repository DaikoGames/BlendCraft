[package]
name = "forge-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "forge3d"
path = "src/main.rs"

[dependencies]
forge-core.workspace = true
forge-io.workspace = true
forge-render.workspace = true
glam.workspace = true
winit.workspace = true
pollster.workspace = true
env_logger.workspace = true
log.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true
egui-winit = { version = "0.29", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
openh264 = { version = "0.6", features = ["source"], optional = true }
minimp4 = { version = "0.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
console_log.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = ["video-export"]
# H.264 animation export via OpenH264 (source) + minimp4.
# Disable on targets where the C++ build is painful (some cross / tier-3).
video-export = ["dep:openh264", "dep:minimp4"]
