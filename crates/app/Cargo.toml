[package]
name = "forge-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Desktop enables `python-scripting` by default; experimental 32-bit / BSD CI can
# build with `--no-default-features` to skip RustPython (known i686 time_t bugs).
default = []
python-scripting = ["dep:rustpython-vm", "dep:rustpython-stdlib", "dep:rustpython-pylib"]


[dependencies]

forge-core.workspace = true
forge-io.workspace = true
forge-render.workspace = true
glam.workspace = true
winit.workspace = true
anyhow.workspace = true
log.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
wasm-bindgen.workspace = true
js-sys = "0.3"
web-sys = { workspace = true, features = [
  "Window", "Document", "Element", "HtmlElement",
  "HtmlInputElement", "FileList", "File", "Blob",
  "BlobPropertyBag", "Url", "FileReader", "Event",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
rfd.workspace = true
egui-winit = { version = "0.29", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
forge-video.workspace = true
# 0.4.0 is the last release before the ruff_python_ast API break that makes
# 0.6.0 fail to compile against current crates.io ruff crates. Pin exactly.
rustpython-vm = { version = "=0.4.0", optional = true, default-features = false, features = ["compiler"] }
rustpython-stdlib = { version = "=0.4.0", optional = true, default-features = false, features = ["compiler"] }
# Pure-Python stdlib (json, traceback, …). freeze-stdlib embeds Lib/ in the binary.
rustpython-pylib = { version = "=0.4.0", optional = true, default-features = false, features = ["freeze-stdlib"] }

