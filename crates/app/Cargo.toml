[package]
name = "forge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["python-scripting"]
python-scripting = ["dep:rustpython-vm", "dep:rustpython-stdlib", "dep:rustpython-pylib"]

[[bin]]
name = "forge3d"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]

forge-core.workspace = true
forge-io.workspace = true
forge-render.workspace = true
glam.workspace = true
winit.workspace = true
pollster.workspace = true
env_logger.workspace = true
log.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true
egui-winit = { version = "0.29", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
forge-video.workspace = true
# 0.4.0 is the last release before the ruff_python_ast API break that makes
# 0.6.0 fail to compile against current crates.io ruff crates. Pin exactly.
rustpython-vm = { version = "=0.4.0", optional = true, default-features = false, features = ["compiler"] }
rustpython-stdlib = { version = "=0.4.0", optional = true, default-features = false, features = ["compiler"] }
# Pure-Python stdlib (json, traceback, …). freeze-stdlib embeds Lib/ in the binary.
rustpython-pylib = { version = "=0.4.0", optional = true, default-features = false, features = ["freeze-stdlib"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
console_log.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
getrandom = { version = "0.3", features = ["wasm_js"] }
