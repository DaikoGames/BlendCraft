[package]
name = "forge-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forge-core.workspace = true
glam.workspace = true
bytemuck.workspace = true
wgpu.workspace = true
anyhow.workspace = true
half.workspace = true
log.workspace = true
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL2 fallback for browsers without WebGPU (Firefox, Chrome on unsupported GPUs).
wgpu = { workspace = true, features = ["webgl"] }
js-sys = "0.3"

[dev-dependencies]
naga = { version = "=22.1.0", features = ["wgsl-in"] }
