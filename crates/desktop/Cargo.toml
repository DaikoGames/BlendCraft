[package]
name = "forge-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "forge3d"
path = "src/main.rs"

[features]
default = ["python-scripting"]
python-scripting = ["forge-app/python-scripting"]

[build-dependencies]
winresource = "0.1"

[dependencies]
forge-app = { path = "../app", default-features = false }
winit.workspace = true
env_logger.workspace = true
log.workspace = true
