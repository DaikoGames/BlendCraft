# BlendCraft — multi-platform builds
# Triggers on push/PR to main and on manual run.
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # ---------------------------------------------------------------------------
  # Native desktop targets (host OS = target OS where possible)
  # ---------------------------------------------------------------------------
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: blendcraft-linux-x64
          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: blendcraft-linux-arm64
            cross: true
          - name: Linux x86
            os: ubuntu-latest
            target: i686-unknown-linux-gnu
            artifact: blendcraft-linux-x86
            cross: true
          - name: Linux ARMv7
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            artifact: blendcraft-linux-armv7
            cross: true

          # Windows
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: blendcraft-windows-x64
          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: blendcraft-windows-arm64
            cross: true
          - name: Windows x86
            os: windows-latest
            target: i686-pc-windows-msvc
            artifact: blendcraft-windows-x86

          # macOS
          - name: macOS x64 (Intel)
            os: macos-13
            target: x86_64-apple-darwin
            artifact: blendcraft-macos-x64
          - name: macOS ARM64 (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
            artifact: blendcraft-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux dependencies (native)
        if: runner.os == 'Linux' && matrix.cross != true
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Install cross (for cross-compiles)
        if: matrix.cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: matrix.cross != true
        run: cargo build --release -p forge-app --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release -p forge-app --target ${{ matrix.target }}

      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/forge3d"
          cp "$BIN" "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"
          # Universal binary helper note for macOS is optional later

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/forge3d.exe" "dist/${{ matrix.artifact }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # FreeBSD (VM via vmactions)
  # ---------------------------------------------------------------------------
  freebsd:
    name: FreeBSD x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.1"
          usesh: true
          prepare: |
            pkg install -y rust pkgconf libxkbcommon wayland libX11 libXcursor libXrandr libXi mesa-libs
          run: |
            rustc --version || true
            # Install rustup if the image only has a minimal toolchain
            if ! command -v cargo >/dev/null 2>&1; then
              fetch -o /tmp/rustup.sh https://sh.rustup.rs
              sh /tmp/rustup.sh -y
              . "$HOME/.cargo/env"
            fi
            cargo build --release -p forge-app --target x86_64-unknown-freebsd
            mkdir -p dist
            cp target/x86_64-unknown-freebsd/release/forge3d dist/blendcraft-freebsd-x64
            chmod +x dist/blendcraft-freebsd-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blendcraft-freebsd-x64
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # WebAssembly (wgpu WebGPU / WebGL via browser)
  # ---------------------------------------------------------------------------
  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack / trunk tooling
        run: |
          cargo install wasm-bindgen-cli --version 0.2.99 || cargo install wasm-bindgen-cli
          # trunk is optional; we use cargo + wasm-bindgen for a minimal build check

      - name: Check WASM compiles (library / app surface)
        run: |
          rustup target add wasm32-unknown-unknown
          # Desktop-only crates (rfd file dialogs, etc.) may fail on pure bin —
          # compile the render + core graph which is the portable core.
          cargo check -p forge-core --target wasm32-unknown-unknown
          cargo check -p forge-io --target wasm32-unknown-unknown
          # forge-app may need wasm-specific entry (winit web); check and report
          cargo check -p forge-app --target wasm32-unknown-unknown || {
            echo "::warning::forge-app is not fully WASM-ready yet (winit/rfd desktop APIs)."
            echo "Core + IO crates compile for wasm32-unknown-unknown."
          }

      - name: Package WASM stub note
        run: |
          mkdir -p dist
          cat > dist/README-wasm.txt << 'EOF'
          BlendCraft WebAssembly
          ----------------------
          forge-core and forge-io target wasm32-unknown-unknown.
          The full GUI app (forge-app) still depends on desktop APIs (rfd, etc.).
          Next step for a browser build: wasm-specific main + winit web features
          and egui web integration (see README section "WebAssembly").
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blendcraft-wasm-notes
          path: dist/*

  # ---------------------------------------------------------------------------
  # Optional: attach all artifacts on a published GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Attach to release
    needs: [desktop, freebsd, wasm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten into dist/
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
