name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Name of the binary produced by the forge-app crate.
  # Change this if your [[bin]] / package name differs.
  BIN: forge-app

jobs:
  # ---------------------------------------------------------------------------
  # Tests (fast feedback, Linux only)
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev \
            libudev-dev libgtk-3-dev
      - run: cargo test -p forge-core

  # ---------------------------------------------------------------------------
  # WebAssembly: library crates only (the full GUI app has no web entry yet)
  # ---------------------------------------------------------------------------
  wasm:
    name: WebAssembly (check)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Adjust crate names if yours differ.
      - run: cargo check -p forge-core -p forge-io --target wasm32-unknown-unknown

  # ---------------------------------------------------------------------------
  # Linux / Windows / macOS
  # "experimental" targets can fail without failing the whole workflow.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux ----
          - { name: linux-x64,    os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,        cross: false, ext: "",     experimental: false }
          - { name: linux-x86,    os: ubuntu-latest,  target: i686-unknown-linux-gnu,          cross: true,  ext: "",     experimental: true  }
          - { name: linux-arm64,  os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,       cross: true,  ext: "",     experimental: true  }
          - { name: linux-armv7,  os: ubuntu-latest,  target: armv7-unknown-linux-gnueabihf,   cross: true,  ext: "",     experimental: true  }
          # ---- Windows ----
          - { name: windows-x64,   os: windows-latest, target: x86_64-pc-windows-msvc,         cross: false, ext: ".exe", experimental: false }
          - { name: windows-x86,   os: windows-latest, target: i686-pc-windows-msvc,           cross: false, ext: ".exe", experimental: true  }
          - { name: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc,        cross: false, ext: ".exe", experimental: true  }
          # ---- macOS ----
          # macos-13 was retired by GitHub; macos-15-intel is the Intel runner now.
          - { name: macos-x64,    os: macos-15-intel, target: x86_64-apple-darwin,             cross: false, ext: "",     experimental: false }
          - { name: macos-arm64,  os: macos-14,       target: aarch64-apple-darwin,            cross: false, ext: "",     experimental: false }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies (native build only)
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev \
            libudev-dev libgtk-3-dev

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release -p forge-app --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release -p forge-app --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blendcraft-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ env.BIN }}${{ matrix.ext }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # FreeBSD (built inside a FreeBSD VM)
  #   x64  : normal target
  #   x86  : i686-unknown-freebsd (experimental, needs 32-bit libs in the VM)
  #   arm32: armv7-unknown-freebsd is Rust "tier 3" (nightly + build-std and
  #          a 32-bit ARM sysroot). Expected to fail without extra setup, so
  #          it is allowed to fail.
  # ---------------------------------------------------------------------------
  freebsd:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: freebsd-x64,   target: x86_64-unknown-freebsd,  experimental: false }
          - { name: freebsd-x86,   target: i686-unknown-freebsd,    experimental: true  }
          - { name: freebsd-armv7, target: armv7-unknown-freebsd,   experimental: true  }
    steps:
      - uses: actions/checkout@v4

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ env.BIN }}
        with:
          envs: "TARGET BIN"
          usesh: true
          prepare: |
            pkg install -y curl pkgconf
          run: |
            set -e
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"

            if [ "$TARGET" = "armv7-unknown-freebsd" ]; then
              # Tier 3 target: no prebuilt std, so build it from source on nightly.
              rustup toolchain install nightly --profile minimal --component rust-src
              cargo +nightly build --release -p forge-app --target "$TARGET" -Zbuild-std=std,panic_abort
            else
              if [ "$TARGET" != "x86_64-unknown-freebsd" ]; then
                rustup target add "$TARGET"
              fi
              cargo build --release -p forge-app --target "$TARGET"
            fi

            mkdir -p dist
            cp "target/$TARGET/release/$BIN" dist/
            rm -rf target

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blendcraft-${{ matrix.name }}
          path: dist/${{ env.BIN }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release: runs when you push a tag like v0.1.0
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: blendcraft-*
          path: dist

      - name: Package binaries
        run: |
          cd dist
          for d in */; do
            n="${d%/}"
            if ls "$n"/*.exe >/dev/null 2>&1; then
              (cd "$n" && zip -q "../$n.zip" ./*)
            else
              chmod +x "$n"/*
              tar -czf "$n.tar.gz" -C "$n" .
            fi
          done
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Experimental, untested builds: Linux x86 / ARM64 / ARMv7, Windows x86 / ARM64,
            FreeBSD x86 / ARMv7. If one is missing from the assets, its build failed.
          files: |
            dist/*.zip
            dist/*.tar.gz
