name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # Package that contains the app. The binary name is detected automatically
  # (see "Detect binary name" steps), so it no longer has to match this.
  APP_PACKAGE: forge-app

jobs:
  # ---------------------------------------------------------------------------
  # Tests (fast feedback, Linux only)
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev \
            libudev-dev
      - run: cargo test -p forge-core

  # ---------------------------------------------------------------------------
  # WebAssembly: library crates only (the full GUI app has no web entry yet)
  # ---------------------------------------------------------------------------
  wasm:
    name: WebAssembly (check)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p forge-core -p forge-io --target wasm32-unknown-unknown

  # ---------------------------------------------------------------------------
  # Linux / Windows / macOS
  # "experimental" targets can fail without failing the whole workflow.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux ----
          - { name: linux-x64,     os: ubuntu-24.04,   target: x86_64-unknown-linux-gnu,      cross: false, ext: "",     experimental: false }
          - { name: linux-x86,     os: ubuntu-24.04,   target: i686-unknown-linux-gnu,        cross: true,  ext: "",     experimental: true  }
          - { name: linux-arm64,   os: ubuntu-24.04,   target: aarch64-unknown-linux-gnu,     cross: true,  ext: "",     experimental: true  }
          - { name: linux-armv7,   os: ubuntu-24.04,   target: armv7-unknown-linux-gnueabihf, cross: true,  ext: "",     experimental: true  }
          - { name: linux-riscv64,      os: ubuntu-24.04, target: riscv64gc-unknown-linux-gnu,  cross: true, ext: "", experimental: true }
          # No cross image exists for this target, so it is built with cargo-zigbuild (zig as C cross-compiler).
          - { name: linux-riscv64-musl, os: ubuntu-24.04, target: riscv64gc-unknown-linux-musl, cross: false, zig: true, ext: "", experimental: true }
          # ---- Windows ----
          - { name: windows-x64,   os: windows-latest, target: x86_64-pc-windows-msvc,        cross: false, ext: ".exe", experimental: false }
          - { name: windows-x86,   os: windows-latest, target: i686-pc-windows-msvc,          cross: false, ext: ".exe", experimental: true  }
          - { name: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc,       cross: false, ext: ".exe", experimental: true  }
          # ---- macOS ----
          # macos-13 and macos-14 are retired. macos-15-intel = Intel, macos-15 = Apple Silicon.
          - { name: macos-x64,     os: macos-15-intel, target: x86_64-apple-darwin,           cross: false, ext: "",     experimental: false }
          - { name: macos-arm64,   os: macos-15,       target: aarch64-apple-darwin,          cross: false, ext: "",     experimental: false }
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Detect binary name
        shell: bash
        run: |
          BIN=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg pkg "$APP_PACKAGE" '.packages[] | select(.name==$pkg) | .targets[] | select(.kind | index("bin")) | .name' \
            | head -n1 | tr -d '\r')
          test -n "$BIN" || { echo "No binary target found in package $APP_PACKAGE"; exit 1; }
          echo "Binary name: $BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies (native build only)
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev \
            libudev-dev

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install zig + cargo-zigbuild
        if: matrix.zig
        run: python3 -m pip install --break-system-packages cargo-zigbuild ziglang

      - name: Build (cargo)
        if: ${{ !matrix.cross && !matrix.zig }}
        run: cargo build --release -p ${{ env.APP_PACKAGE }} --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release -p ${{ env.APP_PACKAGE }} --target ${{ matrix.target }}

      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --release -p ${{ env.APP_PACKAGE }} --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: blendcraft-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ env.BIN }}${{ matrix.ext }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # FreeBSD (built inside a FreeBSD VM)
  #   x64  : normal target
  #   x86  : i686-unknown-freebsd (experimental)
  #   arm32: NOT included. armv7-unknown-freebsd is Rust "tier 3" and there is
  #          no 32-bit ARM FreeBSD VM or sysroot available on GitHub runners.
  # ---------------------------------------------------------------------------
  freebsd:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: freebsd-x64,   target: x86_64-unknown-freebsd, experimental: false }
          - { name: freebsd-x86,   target: i686-unknown-freebsd,   experimental: true  }
    steps:
      - uses: actions/checkout@v5

      # Detect the binary name here (on the Ubuntu runner) so the VM script
      # does not need jq. Rust/cargo are preinstalled on GitHub's Ubuntu runners.
      - name: Detect binary name
        shell: bash
        run: |
          BIN=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg pkg "$APP_PACKAGE" '.packages[] | select(.name==$pkg) | .targets[] | select(.kind | index("bin")) | .name' \
            | head -n1 | tr -d '\r')
          test -n "$BIN" || { echo "No binary target found in package $APP_PACKAGE"; exit 1; }
          echo "Binary name: $BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ env.BIN }}
          APP_PACKAGE: ${{ env.APP_PACKAGE }}
        with:
          envs: "TARGET BIN APP_PACKAGE"
          usesh: true
          prepare: |
            pkg install -y curl pkgconf
          run: |
            set -e
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"

            if [ "$TARGET" != "x86_64-unknown-freebsd" ]; then
              rustup target add "$TARGET"
            fi
            cargo build --release -p "$APP_PACKAGE" --target "$TARGET"

            mkdir -p dist
            cp "target/$TARGET/release/$BIN" dist/
            rm -rf target

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: blendcraft-${{ matrix.name }}
          path: dist/${{ env.BIN }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # FreeBSD ARM64 (aarch64): cross-compiled on a normal Linux runner using
  # clang + lld and the sysroot from FreeBSD's base.txz. This replaces the old
  # emulated VM (hours) with a native-speed build (minutes).
  # aarch64-unknown-freebsd is Rust "tier 3", so std is built from source on
  # nightly (-Zbuild-std). Allowed to fail without breaking the rest.
  # ---------------------------------------------------------------------------
  freebsd-arm64:
    name: freebsd-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    env:
      FREEBSD_VERSION: "14.4"
      TARGET: aarch64-unknown-freebsd
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: freebsd-arm64

      - name: Detect binary name
        shell: bash
        run: |
          BIN=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg pkg "$APP_PACKAGE" '.packages[] | select(.name==$pkg) | .targets[] | select(.kind | index("bin")) | .name' \
            | head -n1 | tr -d '\r')
          test -n "$BIN" || { echo "No binary target found in package $APP_PACKAGE"; exit 1; }
          echo "Binary name: $BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      # The sysroot (FreeBSD libc + headers) is cached, so it is only downloaded once.
      - name: Cache FreeBSD sysroot
        id: sysroot-cache
        uses: actions/cache@v4
        with:
          path: ~/sysroot
          key: freebsd-sysroot-arm64-${{ env.FREEBSD_VERSION }}

      - name: Download FreeBSD sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/sysroot"
          ok=0
          for host in https://download.freebsd.org https://mirrors.mit.edu/FreeBSD https://ftp5.us.freebsd.org; do
            url="$host/releases/arm64/aarch64/${FREEBSD_VERSION}-RELEASE/base.txz"
            echo "Trying $url"
            if curl -fsSL --retry 3 "$url" -o base.txz; then ok=1; break; fi
          done
          test "$ok" = 1 || { echo "Could not download base.txz for FreeBSD ${FREEBSD_VERSION}"; exit 1; }
          tar -xf base.txz -C "$HOME/sysroot" ./lib ./usr/lib ./usr/include
          rm base.txz

      - name: Install clang + lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Create cross compiler wrapper
        run: |
          printf '#!/bin/sh\nexec clang --target=aarch64-unknown-freebsd%s --sysroot=%s -fuse-ld=lld "$@"\n' \
            "${FREEBSD_VERSION%%.*}" "$HOME/sysroot" > "$HOME/freebsd-cc"
          chmod +x "$HOME/freebsd-cc"

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_FREEBSD_LINKER: /home/runner/freebsd-cc
          CC_aarch64_unknown_freebsd: /home/runner/freebsd-cc
          AR_aarch64_unknown_freebsd: ar
        run: cargo build --release -p "$APP_PACKAGE" --target "$TARGET" -Zbuild-std=std,panic_abort

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: blendcraft-freebsd-arm64
          path: target/${{ env.TARGET }}/release/${{ env.BIN }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Flatpak (x86_64 + aarch64): packages the already-built Linux binaries into
  # .flatpak bundles, so nothing is compiled twice. The manifest, desktop file,
  # metainfo (license + metadata) and icon are generated inline below.
  # ---------------------------------------------------------------------------
  flatpak:
    name: flatpak-${{ matrix.name }}
    needs: build
    # Still run if an unrelated build (e.g. Windows) failed; it only needs the Linux binary.
    if: ${{ !cancelled() }}
    # ARM64 is built natively on GitHub's free Linux ARM runner (public repos).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x64,   os: ubuntu-24.04,     arch: x86_64,  artifact: blendcraft-linux-x64 }
          - { name: arm64, os: ubuntu-24.04-arm, arch: aarch64, artifact: blendcraft-linux-arm64 }
    env:
      APP_ID: io.github.DaikoGames.BlendCraft
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: flatpak-in

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Cache Flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-${{ matrix.arch }}-25.08

      - name: Generate Flatpak files
        run: |
          set -e
          BIN=$(ls flatpak-in | head -n1)
          chmod +x "flatpak-in/$BIN"
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) VERSION="0.1.0" ;; esac
          mkdir -p fp && cp "flatpak-in/$BIN" "fp/$BIN"
          cd fp

          cat > "$APP_ID.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=BlendCraft
          Comment=Open-source 3D suite for game assets
          Exec=$BIN %f
          Icon=$APP_ID
          Terminal=false
          Categories=Graphics;3DGraphics;
          MimeType=model/gltf-binary;
          EOF

          cat > "$APP_ID.metainfo.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>$APP_ID</id>
            <name>BlendCraft</name>
            <summary>Open-source 3D suite for game assets, written in Rust</summary>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>MIT</project_license>
            <description>
              <p>BlendCraft is an early, independent open-source 3D suite written in Rust. It is not affiliated with the Blender Foundation.</p>
            </description>
            <launchable type="desktop-id">$APP_ID.desktop</launchable>
            <url type="homepage">https://github.com/DaikoGames/BlendCraft</url>
            <provides><binary>$BIN</binary></provides>
            <releases><release version="$VERSION" date="$(date +%F)"/></releases>
            <content_rating type="oars-1.1"/>
          </component>
          EOF

          cat > icon.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
            <rect width="128" height="128" rx="24" fill="#1e2327"/>
            <path d="M64 24 100 44v40L64 104 28 84V44z" fill="#ea7600"/>
            <path d="M64 24 100 44 64 64 28 44z" fill="#ffb066"/>
          </svg>
          EOF

          cat > "$APP_ID.yml" <<EOF
          app-id: $APP_ID
          runtime: org.freedesktop.Platform
          runtime-version: '25.08'
          sdk: org.freedesktop.Sdk
          command: $BIN
          finish-args:
            - --share=ipc
            - --share=network
            - --socket=x11
            - --socket=wayland
            - --device=dri
          modules:
            - name: blendcraft
              buildsystem: simple
              build-commands:
                - install -Dm755 $BIN /app/bin/$BIN
                - install -Dm644 $APP_ID.desktop /app/share/applications/$APP_ID.desktop
                - install -Dm644 $APP_ID.metainfo.xml /app/share/metainfo/$APP_ID.metainfo.xml
                - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/$APP_ID.svg
              sources:
                - type: file
                  path: $BIN
                - type: file
                  path: $APP_ID.desktop
                - type: file
                  path: $APP_ID.metainfo.xml
                - type: file
                  path: icon.svg
          EOF

      - name: Build Flatpak bundle
        working-directory: fp
        run: |
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=repo builddir "$APP_ID.yml"
          flatpak build-bundle repo "BlendCraft-${{ matrix.arch }}.flatpak" "$APP_ID"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: blendcraft-flatpak-${{ matrix.name }}
          path: fp/BlendCraft-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release
  #  - Push a tag like v0.1.0  -> normal release with auto-generated notes.
  #  - Any other push / manual run (not pull requests) -> the rolling
  #    pre-release called "latest" is replaced with the newest builds.
  # Runs even if some other job failed, and publishes whatever was built.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: [test, build, freebsd, freebsd-arm64, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: blendcraft-*
          path: dist

      # No archives: each binary is uploaded as-is, renamed so the platform
      # is in the file name (e.g. blendcraft-linux-x64, blendcraft-windows-x64.exe).
      - name: Collect binaries
        run: |
          shopt -s nullglob
          mkdir -p out
          for d in dist/*/; do
            n=$(basename "$d")
            for f in "$d"*; do
              case "$f" in
                *.flatpak) mv "$f" out/ ;;
                *.exe)     mv "$f" "out/$n.exe" ;;
                *)         mv "$f" "out/$n" ;;
              esac
            done
          done
          ls -lh out
          test -n "$(ls -A out)" || { echo "No build artifacts were produced, nothing to release."; exit 1; }

      - name: Remove the old rolling release
        if: env.IS_TAG != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes --repo "${{ github.repository }}" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.IS_TAG == 'true' && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.IS_TAG == 'true' && github.ref_name || 'Latest build (automatic)' }}
          prerelease: ${{ env.IS_TAG != 'true' }}
          make_latest: ${{ env.IS_TAG == 'true' }}
          generate_release_notes: ${{ env.IS_TAG == 'true' }}
          body: |
            ${{ env.IS_TAG != 'true' && format('Automatic build of commit {0}. Not a stable release.', github.sha) || '' }}

            Experimental, untested builds: Linux x86 / ARM64 / ARMv7 / RISC-V 64 (glibc and musl), Windows x86 / ARM64,
            FreeBSD x86 / ARM64. Flatpaks are built for x86_64 and aarch64. On Linux/macOS/FreeBSD run chmod +x on the downloaded file first. If one is missing from the assets, its build failed.
          files: out/*
