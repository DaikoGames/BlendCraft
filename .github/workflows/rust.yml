name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  APP_PACKAGE: forge-app

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf > /dev/null
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          for i in 1 2 3; do
            sudo apt-get update && break || sleep 3
          done
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev \
            libudev-dev

      - run: cargo test -p forge-core -p forge-video -p forge-app

  wasm:
    name: WebAssembly (check)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p forge-core -p forge-io --target wasm32-unknown-unknown --no-default-features

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,     os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu,      zig: false, scripting: true,  ext: "",     experimental: false }
          - { name: linux-arm64,   os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,     zig: false, scripting: true,  ext: "",     experimental: true  }
          - { name: windows-x64,   os: windows-latest,   target: x86_64-pc-windows-msvc,        zig: false, scripting: true,  ext: ".exe", experimental: false }
          - { name: macos-x64,     os: macos-15-intel,   target: x86_64-apple-darwin,           zig: false, scripting: true,  ext: "",     experimental: false }
          - { name: macos-arm64,   os: macos-latest,     target: aarch64-apple-darwin,          zig: false, scripting: true,  ext: "",     experimental: false }
          - { name: linux-x86,     os: ubuntu-24.04,     target: i686-unknown-linux-gnu,        zig: true,  scripting: true, ext: "",     experimental: true  }
          - { name: linux-armv7,   os: ubuntu-24.04,     target: armv7-unknown-linux-gnueabihf, zig: true,  scripting: true, ext: "",     experimental: true  }
          - { name: linux-riscv64, os: ubuntu-24.04,     target: riscv64gc-unknown-linux-gnu,   zig: true,  scripting: true, ext: "",     experimental: true  }
          - { name: linux-riscv64-musl, os: ubuntu-24.04, target: riscv64gc-unknown-linux-musl, zig: true,  scripting: true, ext: "",     experimental: true  }
          - { name: windows-x86,   os: windows-latest,   target: i686-pc-windows-msvc,          zig: false, scripting: true, ext: ".exe", experimental: true  }
          - { name: windows-arm64, os: windows-latest,   target: aarch64-pc-windows-msvc,       zig: false, scripting: true, ext: ".exe", experimental: true  }

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Detect binary name
        shell: bash
        run: |
          BIN=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg pkg "$APP_PACKAGE" '.packages[] | select(.name==$pkg) | .targets[] | select(.kind | index("bin")) | .name' \
            | head -n1 | tr -d '\r')
          test -n "$BIN" || { echo "No binary target found in package $APP_PACKAGE"; exit 1; }
          echo "Binary name: $BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Verify Windows app icon assets
        if: runner.os == 'Windows'
        shell: bash
        run: |
          test -f crates/app/icon.ico || { echo "Missing crates/app/icon.ico"; exit 1; }
          test -f crates/app/build.rs || { echo "Missing crates/app/build.rs"; exit 1; }
          test -f crates/app/logo.png || { echo "Missing crates/app/logo.png"; exit 1; }

      - name: Install Linux build dependencies (native)
        if: runner.os == 'Linux' && !matrix.zig
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf > /dev/null
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          for i in 1 2 3; do
            sudo apt-get update && break || sleep 3
          done
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev \
            libudev-dev

      - name: Install zig + cargo-zigbuild
        if: matrix.zig
        run: python3 -m pip install --break-system-packages cargo-zigbuild ziglang

      - name: Build (with RustPython scripting)
        if: ${{ !matrix.zig && matrix.scripting }}
        run: cargo build --release -p ${{ env.APP_PACKAGE }} --target ${{ matrix.target }}

      - name: Build (without scripting)
        if: ${{ !matrix.zig && !matrix.scripting }}
        run: cargo build --release -p ${{ env.APP_PACKAGE }} --no-default-features --target ${{ matrix.target }}

      - name: Build (zigbuild, with RustPython scripting)
        if: ${{ matrix.zig && matrix.scripting }}
        run: cargo zigbuild --release -p ${{ env.APP_PACKAGE }} --target ${{ matrix.target }}

      - name: Build (zigbuild, without scripting)
        if: ${{ matrix.zig && !matrix.scripting }}
        run: cargo zigbuild --release -p ${{ env.APP_PACKAGE }} --no-default-features --target ${{ matrix.target }}

      - name: Package AppImage
        if: >
          runner.os == 'Linux' && (
            matrix.target == 'x86_64-unknown-linux-gnu' ||
            matrix.target == 'aarch64-unknown-linux-gnu' ||
            matrix.target == 'i686-unknown-linux-gnu'
          )
        shell: bash
        run: |
          set -e
          BIN="${{ env.BIN }}"
          TARGET="${{ matrix.target }}"
          APPDIR="BlendCraft.AppDir"
          rm -rf "$APPDIR" squashfs-root appimagetool
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp "target/${TARGET}/release/${BIN}" "$APPDIR/usr/bin/${BIN}"
          chmod +x "$APPDIR/usr/bin/${BIN}"
          test -f crates/app/logo.png || { echo "missing crates/app/logo.png"; exit 1; }
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends imagemagick
          fi
          convert crates/app/logo.png -resize 256x256 "$APPDIR/usr/share/icons/hicolor/256x256/apps/blendcraft.png"
          convert crates/app/logo.png -resize 256x256 "$APPDIR/blendcraft.png"
          cat > "$APPDIR/blendcraft.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=BlendCraft
          Comment=Open-source 3D suite for game assets
          Exec=${BIN}
          Icon=blendcraft
          Categories=Graphics;3DGraphics;
          Terminal=false
          EOF
          sed -i 's/^[[:space:]]*//' "$APPDIR/blendcraft.desktop"
          printf '%s\n' '#!/bin/sh' 'SELF=$(readlink -f "$0")' 'HERE=${SELF%/*}' "exec \"\${HERE}/usr/bin/${BIN}\" \"\$@\"" > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          case "$TARGET" in
            x86_64-*)  ARCH_NAME=x86_64 ;;
            aarch64-*) ARCH_NAME=aarch64 ;;
            i686-*)    ARCH_NAME=i686 ;;
            *) echo "unsupported target $TARGET"; exit 1 ;;
          esac
          case "$(uname -m)" in
            aarch64|arm64) TOOL_ARCH=aarch64 ;;
            *)             TOOL_ARCH=x86_64 ;;
          esac
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${TOOL_ARCH}.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract >/dev/null 2>&1 || true
          if [ -x squashfs-root/AppRun ]; then TOOL=./squashfs-root/AppRun; else TOOL=./appimagetool; fi
          export ARCH="$ARCH_NAME"
          "$TOOL" "$APPDIR" "BlendCraft-${{ matrix.name }}.AppImage"
          chmod +x "BlendCraft-${{ matrix.name }}.AppImage"

      - name: Upload artifact (binary)
        uses: actions/upload-artifact@v5
        with:
          name: blendcraft-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ env.BIN }}${{ matrix.ext }}
          if-no-files-found: error

      - name: Upload artifact (AppImage)
        if: >
          runner.os == 'Linux' && (
            matrix.target == 'x86_64-unknown-linux-gnu' ||
            matrix.target == 'aarch64-unknown-linux-gnu' ||
            matrix.target == 'i686-unknown-linux-gnu'
          )
        uses: actions/upload-artifact@v5
        with:
          name: blendcraft-${{ matrix.name }}-appimage
          path: BlendCraft-${{ matrix.name }}.AppImage
          if-no-files-found: warn

  freebsd:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: freebsd-x64, target: x86_64-unknown-freebsd, scripting: true,  experimental: false }
          - { name: freebsd-x86, target: i686-unknown-freebsd,   scripting: true, experimental: true  }
    steps:
      - uses: actions/checkout@v5
      - name: Detect binary name
        shell: bash
        run: |
          BIN=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg pkg "$APP_PACKAGE" '.packages[] | select(.name==$pkg) | .targets[] | select(.kind | index("bin")) | .name' \
            | head -n1 | tr -d '\r')
          test -n "$BIN" || { echo "No binary target found"; exit 1; }
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ env.BIN }}
          APP_PACKAGE: ${{ env.APP_PACKAGE }}
          SCRIPTING: ${{ matrix.scripting }}
        with:
          envs: "TARGET BIN APP_PACKAGE SCRIPTING"
          usesh: true
          prepare: |
            pkg install -y curl pkgconf
          run: |
            set -e
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            if [ "$TARGET" != "x86_64-unknown-freebsd" ]; then
              rustup target add "$TARGET"
            fi
            if [ "$SCRIPTING" = "true" ]; then
              cargo build --release -p "$APP_PACKAGE" --target "$TARGET"
            else
              cargo build --release -p "$APP_PACKAGE" --no-default-features --target "$TARGET"
            fi
            mkdir -p dist
            cp "target/$TARGET/release/$BIN" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: blendcraft-${{ matrix.name }}
          path: dist/${{ env.BIN }}
          if-no-files-found: error

  # FreeBSD aarch64 cannot be reliably linked from a Linux runner without a
  # FreeBSD sysroot/toolchain (host `cc` rejects FreeBSD-specific flags).
  # Native FreeBSD VMs on GHA are amd64-only. Job is a soft no-op so the
  # matrix still lists the platform without failing the workflow.
  freebsd-arm64:
    name: freebsd-arm64
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Unsupported host cross-link
        run: |
          echo "Skipping FreeBSD aarch64 binary: no FreeBSD aarch64 sysroot on this runner."
          echo "Use a native FreeBSD/arm64 machine for that target."
          echo "FreeBSD x64 is built in the freebsd-x64 job with full RustPython scripting."

  flatpak:
    name: flatpak-${{ matrix.name }}
    needs: [build]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x64,   os: ubuntu-24.04,     arch: x86_64,  artifact: blendcraft-linux-x64 }
          - { name: arm64, os: ubuntu-24.04-arm, arch: aarch64, artifact: blendcraft-linux-arm64 }
    steps:
      - uses: actions/checkout@v5
      - name: Download binary artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: flatpak-bin
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder imagemagick
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Detect binary name
        shell: bash
        run: |
          BIN=$(ls flatpak-bin | head -n1)
          test -n "$BIN" || exit 1
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "APP_ID=com.daikogames.BlendCraft" >> "$GITHUB_ENV"
          echo "VERSION=0.1.0" >> "$GITHUB_ENV"
      - name: Prepare Flatpak sources
        shell: bash
        run: |
          set -e
          mkdir -p fp
          cp "flatpak-bin/$BIN" "fp/$BIN"
          chmod +x "fp/$BIN"
          cd fp
          cat > "$APP_ID.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=BlendCraft
          Comment=Open-source 3D suite for game assets
          Exec=$BIN
          Icon=$APP_ID
          Categories=Graphics;3DGraphics;
          Terminal=false
          EOF
          sed -i 's/^[[:space:]]*//' "$APP_ID.desktop"
          cat > "$APP_ID.metainfo.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>$APP_ID</id>
            <name>BlendCraft</name>
            <summary>Open-source 3D suite for game assets</summary>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>MIT</project_license>
            <description>
              <p>BlendCraft is an early, independent open-source 3D suite written in Rust.</p>
            </description>
            <launchable type="desktop-id">$APP_ID.desktop</launchable>
            <url type="homepage">https://github.com/DaikoGames/BlendCraft</url>
            <provides><binary>$BIN</binary></provides>
            <releases><release version="$VERSION" date="$(date +%F)"/></releases>
            <content_rating type="oars-1.1"/>
          </component>
          EOF
          sed -i 's/^[[:space:]]*//' "$APP_ID.metainfo.xml"
          LOGO="../crates/app/logo.png"
          test -f "$LOGO"
          mkdir -p "icons/hicolor/256x256/apps"
          convert "$LOGO" -resize 256x256 "icons/hicolor/256x256/apps/$APP_ID.png"
          cat > "$APP_ID.yml" <<EOF
          app-id: $APP_ID
          runtime: org.freedesktop.Platform
          runtime-version: '25.08'
          sdk: org.freedesktop.Sdk
          command: $BIN
          finish-args:
            - --share=ipc
            - --share=network
            - --socket=x11
            - --socket=wayland
            - --device=dri
          modules:
            - name: blendcraft
              buildsystem: simple
              build-commands:
                - install -Dm755 $BIN /app/bin/$BIN
                - install -Dm644 $APP_ID.desktop /app/share/applications/$APP_ID.desktop
                - install -Dm644 $APP_ID.metainfo.xml /app/share/metainfo/$APP_ID.metainfo.xml
                - mkdir -p /app/share/icons
                - cp -a hicolor /app/share/icons/
              sources:
                - type: file
                  path: $BIN
                - type: file
                  path: $APP_ID.desktop
                - type: file
                  path: $APP_ID.metainfo.xml
                - type: dir
                  path: icons
          EOF
          sed -i 's/^          //' "$APP_ID.yml"
      - name: Build Flatpak bundle
        working-directory: fp
        run: |
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=repo builddir "$APP_ID.yml"
          flatpak build-bundle repo "BlendCraft-${{ matrix.arch }}.flatpak" "$APP_ID"
      - name: Upload Flatpak
        uses: actions/upload-artifact@v5
        with:
          name: blendcraft-flatpak-${{ matrix.name }}
          path: fp/BlendCraft-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  release:
    name: Publish release
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: [test, build, freebsd, freebsd-arm64, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: blendcraft-*
          path: dist
      - name: Collect binaries
        run: |
          shopt -s nullglob
          mkdir -p out
          for d in dist/*/; do
            n=$(basename "$d")
            for f in "$d"*; do
              case "$f" in
                *.flatpak)  mv "$f" out/ ;;
                *.AppImage) mv "$f" "out/$n.AppImage" ;;
                *.exe)      mv "$f" "out/$n.exe" ;;
                *.zip)      mv "$f" "out/$n.zip" ;;
                *)          mv "$f" "out/$n" ;;
              esac
            done
          done
          ls -lh out || true
          test -n "$(ls -A out 2>/dev/null)" || { echo "No build artifacts"; exit 1; }
      - name: Remove the old rolling release
        if: env.IS_TAG != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes --repo "${{ github.repository }}" || true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.IS_TAG == 'true' && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.IS_TAG == 'true' && github.ref_name || 'Latest build (automatic)' }}
          prerelease: ${{ env.IS_TAG != 'true' }}
          make_latest: ${{ env.IS_TAG == 'true' }}
          generate_release_notes: ${{ env.IS_TAG == 'true' }}
          body: |
            ${{ env.IS_TAG != 'true' && format('Automatic build of commit {0}. Not a stable release.', github.sha) || '' }}
            Scripting uses embedded RustPython (no separate CPython runtime).
            On Unix run chmod +x on downloaded binaries first.
          files: out/*
