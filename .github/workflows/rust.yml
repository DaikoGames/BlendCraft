name: Build

# Everything that can plausibly run on a PC is built here.
# "Tier 1" jobs must pass. "Experimental" jobs are allowed to fail (continue-on-error)
# so one exotic OS never blocks the rest; their artifacts are uploaded when they succeed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN: forge3d   # binary produced by crates/desktop (package: forge-desktop)

jobs:
  # =============================================================== TIER 1: native runners
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x64",     os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  ext: "" }
          - { name: "Linux ARM64",   os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { name: "Windows x64",   os: windows-latest,   target: x86_64-pc-windows-msvc,    ext: ".exe" }
          - { name: "Windows x86",   os: windows-latest,   target: i686-pc-windows-msvc,      ext: ".exe" }
          - { name: "Windows ARM64", os: windows-latest,   target: aarch64-pc-windows-msvc,   ext: ".exe" }
          - { name: "macOS ARM64",   os: macos-latest,     target: aarch64-apple-darwin,      ext: "" }
          - { name: "macOS x64",     os: macos-latest,     target: x86_64-apple-darwin,       ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == i686-* ]]; then
            # rustpython-common 0.4 time_t mismatch on 32-bit Windows
            cargo build --release -p forge-desktop --target ${{ matrix.target }} --no-default-features
          else
            cargo build --release -p forge-desktop --target ${{ matrix.target }}
          fi
      - name: Test core
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test -p forge-core
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN}${{ matrix.ext }}" "dist/${BIN}-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-${{ matrix.target }}
          path: dist/*

  # macOS universal binary (Intel + Apple Silicon in one file)
  macos-universal:
    name: macOS Universal
    runs-on: macos-latest
    needs: native
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: blendcraft-*-apple-darwin
          path: in
      - name: lipo
        run: |
          mkdir -p dist
          lipo -create -output dist/${BIN}-universal-apple-darwin \
            in/blendcraft-aarch64-apple-darwin/${BIN}-aarch64-apple-darwin \
            in/blendcraft-x86_64-apple-darwin/${BIN}-x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-universal-apple-darwin
          path: dist/*

  # =============================================================== EXPERIMENTAL: Linux/Windows via `cross`
  cross:
    name: ${{ matrix.name }} (cross, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86 (i686)",        target: i686-unknown-linux-gnu,           ext: "" }
          - { name: "Linux ARMv7",             target: armv7-unknown-linux-gnueabihf,     ext: "" }
          - { name: "Linux x64 musl",          target: x86_64-unknown-linux-musl,         ext: "" }
          - { name: "Linux ARM64 musl",        target: aarch64-unknown-linux-musl,        ext: "" }
          - { name: "Linux RISC-V 64",         target: riscv64gc-unknown-linux-gnu,       ext: "" }
          - { name: "Linux PowerPC64 LE",      target: powerpc64le-unknown-linux-gnu,     ext: "" }
          - { name: "Windows x64 (MinGW)",     target: x86_64-pc-windows-gnu,             ext: ".exe" }
          - { name: "Windows x86 (MinGW)",     target: i686-pc-windows-gnu,               ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build
        run: |
          # RustPython 0.4 hits i686 time_t (i64 vs i32) bugs on several 32-bit targets.
          case "${{ matrix.target }}" in
            i686-*|armv7-*)
              cross build --release -p forge-desktop --target ${{ matrix.target }} --no-default-features
              ;;
            *)
              cross build --release -p forge-desktop --target ${{ matrix.target }}
              ;;
          esac
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN}${{ matrix.ext }}" "dist/${BIN}-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-${{ matrix.target }}
          path: dist/*

  # =============================================================== EXPERIMENTAL: BSD / illumos (VMs)
  bsd:
    name: ${{ matrix.name }} (VM, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "FreeBSD x64",          id: freebsd,   target: x86_64-unknown-freebsd }
          - { name: "OpenBSD x64",          id: openbsd,   target: x86_64-unknown-openbsd }
          - { name: "NetBSD x64",           id: netbsd,    target: x86_64-unknown-netbsd }
          - { name: "DragonFlyBSD x64",     id: dragonfly, target: x86_64-unknown-dragonfly }
          - { name: "illumos (OmniOS) x64", id: omnios,    target: x86_64-unknown-illumos }
    steps:
      - uses: actions/checkout@v4

      - name: Build (FreeBSD)
        if: matrix.id == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y rust pkgconf gtk3 libX11 libxkbcommon wayland
          run: |
            set -e
            if ! cargo build --release -p forge-desktop; then
              cargo build --release -p forge-desktop --no-default-features
            fi
            mkdir -p dist
            cp target/release/forge3d dist/forge3d-x86_64-unknown-freebsd

      - name: Build (OpenBSD)
        if: matrix.id == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add -I rust gtk+3 libxkbcommon
          run: |
            set -e
            export PATH="$HOME/.cargo/bin:/usr/local/bin:$PATH"
            if ! cargo build --release -p forge-desktop; then
              cargo build --release -p forge-desktop --no-default-features
            fi
            mkdir -p dist
            cp target/release/forge3d dist/forge3d-x86_64-unknown-openbsd

      - name: Build (NetBSD)
        if: matrix.id == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          # NetBSD pkgsrc names vary by version; tolerate missing packages.
          prepare: |
            pkgin -y update || true
            pkgin -y install mozilla-rootcerts-openssl ca-certificates curl || true
            mozilla-rootcerts install || true
            pkgin -y install pkgconf gmake || true
            pkgin -y install libX11 libXcursor libXrandr libXi libxkbcommon || true
            pkgin -y install gtk3 || pkgin -y install gtk3+ || true
          run: |
            export PATH="$HOME/.cargo/bin:/usr/pkg/bin:/usr/local/bin:$PATH"
            # Always prefer rustup — pkgsrc rust is often too old / incomplete for wgpu.
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            fi
            . "$HOME/.cargo/env"
            rustc -vV
            cargo -vV
            # No scripting on experimental BSD (fewer deps, avoids RustPython).
            cargo build --release -p forge-desktop --no-default-features
            mkdir -p dist
            test -f target/release/forge3d
            cp target/release/forge3d dist/forge3d-x86_64-unknown-netbsd

      - name: Build (DragonFlyBSD)
        if: matrix.id == 'dragonfly'
        uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg update || true
            pkg install -y rust pkgconf gtk3 libxkbcommon libX11 || true
          run: |
            set -e
            export PATH="$HOME/.cargo/bin:/usr/local/bin:$PATH"
            if ! command -v cargo >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              . "$HOME/.cargo/env"
            fi
            if ! cargo build --release -p forge-desktop; then
              cargo build --release -p forge-desktop --no-default-features
            fi
            mkdir -p dist
            cp target/release/forge3d dist/forge3d-x86_64-unknown-dragonfly

      - name: Build (illumos / OmniOS)
        if: matrix.id == 'omnios'
        uses: vmactions/omnios-vm@v1
        with:
          usesh: true
          prepare: |
            pkg refresh || true
            pkg install -q system/header developer/library/lint || true
            pkg install -q developer/gcc13 || pkg install -q developer/gcc || true
            pkg install -q ooce/developer/rust || true
            pkg install -q library/libx11 library/libxkbcommon || true
          run: |
            export PATH="/opt/ooce/bin:$HOME/.cargo/bin:/usr/gcc/13/bin:/usr/gcc/10/bin:/usr/bin:$PATH"
            # OmniOS package rust is often incomplete; use rustup.
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            fi
            . "$HOME/.cargo/env"
            rustc -vV
            cargo -vV
            # Illumos + full GUI stack is fragile in CI; build without scripting first.
            cargo build --release -p forge-desktop --no-default-features
            mkdir -p dist
            test -f target/release/forge3d
            cp target/release/forge3d dist/forge3d-x86_64-unknown-illumos

      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-${{ matrix.target }}
          path: dist/*

  # =============================================================== WEB (WebAssembly)
  web:
    name: Web (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Install wasm-bindgen CLI (must match Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build web app
        run: bash web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-web
          path: web/dist

  # =============================================================== RELEASE (on tag v*)
  release:
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.native.result == 'success' && needs.web.result == 'success'
    needs: [native, macos-universal, cross, bsd, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip web build
        run: cd artifacts/blendcraft-web && zip -r ../blendcraft-web.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/forge3d*
            artifacts/blendcraft-web.zip
