name: Build

# Tier 1 jobs must pass. Experimental jobs use continue-on-error.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release with ALL build artifacts"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (e.g. v0.1.0)"
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  BIN: forge3d

jobs:
  # ---------------------------------------------------------------
  # Tier 1: Native builds
  # ---------------------------------------------------------------
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x64",     os: ubuntu-22.04,        target: x86_64-unknown-linux-gnu, ext: "" }
          - { name: "Linux ARM64",  os: ubuntu-22.04-arm,    target: aarch64-unknown-linux-gnu, ext: "" }
          - { name: "Windows x64",  os: windows-latest,    target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { name: "Windows x86",  os: windows-latest,    target: i686-pc-windows-msvc, ext: ".exe" }
          - { name: "Windows ARM64", os: windows-latest,    target: aarch64-pc-windows-msvc, ext: ".exe" }
          - { name: "macOS ARM64",   os: macos-latest,     target: aarch64-apple-darwin, ext: "" }
          - { name: "macOS x64",     os: macos-latest,     target: x86_64-apple-darwin, ext: "" }

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: v2-${{ matrix.os }}-${{ matrix.target }}

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgtk-3-dev

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == i686-* ]]; then
            cargo build --release -p forge-desktop \
              --target ${{ matrix.target }} \
              --no-default-features
          else
            cargo build --release -p forge-desktop \
              --target ${{ matrix.target }}
          fi

      - name: Test core
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test -p forge-core

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN}${{ matrix.ext }}" \
             "dist/${BIN}-${{ matrix.target }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------
  # macOS Universal
  # ---------------------------------------------------------------
  macos-universal:
    name: macOS Universal
    runs-on: macos-latest
    needs: native

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: blendcraft-*-apple-darwin
          path: in
          merge-multiple: false

      - name: Create Universal Binary
        run: |
          mkdir -p dist

          lipo -create \
            -output dist/${BIN}-universal-apple-darwin \
            in/blendcraft-aarch64-apple-darwin/${BIN}-aarch64-apple-darwin \
            in/blendcraft-x86_64-apple-darwin/${BIN}-x86_64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-universal-apple-darwin
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Experimental: Cross compilation
  # ---------------------------------------------------------------
  cross:
    name: ${{ matrix.name }} (cross, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86 (i686)", target: i686-unknown-linux-gnu, ext: "" }
          - { name: "Linux ARMv7", target: armv7-unknown-linux-gnueabihf, ext: "" }
          - { name: "Linux x64 musl", target: x86_64-unknown-linux-musl, ext: "" }
          - { name: "Linux ARM64 musl", target: aarch64-unknown-linux-musl, ext: "" }
          - { name: "Linux RISC-V 64", target: riscv64gc-unknown-linux-gnu, ext: "" }
          - { name: "Linux PowerPC64 LE", target: powerpc64le-unknown-linux-gnu, ext: "" }
          - { name: "Windows x64 (MinGW)", target: x86_64-pc-windows-gnu, ext: ".exe" }
          - { name: "Windows x86 (MinGW)", target: i686-pc-windows-gnu, ext: ".exe" }
          - { name: "FreeBSD x64", target: x86_64-unknown-freebsd, ext: "" }
          - { name: "FreeBSD ARM64", target: aarch64-unknown-freebsd, ext: "" }
          - { name: "FreeBSD x86", target: i686-unknown-freebsd, ext: "" }

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build
        run: |
          case "${{ matrix.target }}" in
            *-freebsd)
              # Try the FULL build first (GUI + scripting). Only if that
              # fails fall back to the headless build and tag the file.
              if cross build --release -p forge-desktop \
                   --target ${{ matrix.target }}; then
                echo "Full feature build OK"
              else
                echo "::warning::Full build failed for ${{ matrix.target }}, building headless fallback"
                cross build --release -p forge-desktop \
                  --target ${{ matrix.target }} \
                  --no-default-features
                echo "SUFFIX=-headless" >> "$GITHUB_ENV"
              fi
              ;;
            i686-*|armv7-*)
              cross build --release -p forge-desktop \
                --target ${{ matrix.target }} \
                --no-default-features \
                || cargo build --release -p forge-desktop \
                  --target ${{ matrix.target }} \
                  --no-default-features
              ;;
            *)
              cross build --release -p forge-desktop \
                --target ${{ matrix.target }}
              ;;
          esac

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN}${{ matrix.ext }}" \
             "dist/${BIN}-${{ matrix.target }}${SUFFIX:-}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blendcraft-${{ matrix.target }}
          path: dist/*
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # OpenBSD + DragonFlyBSD. These only exist as VMs (no cross images, no
  # prebuilt std). NO scripting: rustpython-vm 0.4.0 does not compile there.
  # ---------------------------------------------------------------
  bsd-extra:
    name: ${{ matrix.name }} (VM, experimental, no scripting)
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "OpenBSD x64", id: openbsd, target: x86_64-unknown-openbsd }
          - { name: "DragonFlyBSD x64", id: dragonfly, target: x86_64-unknown-dragonfly }

    steps:
      - uses: actions/checkout@v4

      # Cargo home + target inside the workspace -> synced into the VM
      # and cached between runs (first run slow, later runs fast).
      - uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            target
          key: bsd-${{ matrix.id }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: bsd-${{ matrix.id }}-

      - name: Build (OpenBSD)
        if: matrix.id == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          cpu: 4
          mem: 8192
          prepare: pkg_add -I rust gtk+3 libxkbcommon
          run: |
            set -e
            export PATH="$HOME/.cargo/bin:/usr/local/bin:$PATH"
            export CARGO_HOME="$PWD/.cargo-home"
            cargo build --release -p forge-desktop --no-default-features
            mkdir -p dist
            cp target/release/forge3d dist/forge3d-x86_64-unknown-openbsd-headless

      - name: Build (DragonFlyBSD)
        if: matrix.id == 'dragonfly'
        uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          cpu: 4
          mem: 8192
          prepare: pkg install -y rust pkgconf gtk3 libxkbcommon libX11
          run: |
            set -e
            export PATH="$HOME/.cargo/bin:/usr/local/bin:$PATH"
            export CARGO_HOME="$PWD/.cargo-home"
            cargo build --release -p forge-desktop --no-default-features
            mkdir -p dist
            cp target/release/forge3d dist/forge3d-x86_64-unknown-dragonfly-headless

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blendcraft-${{ matrix.target }}
          path: dist/*
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Web
  # ---------------------------------------------------------------
  web:
    name: Web (wasm32)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Build web app
        run: bash web/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-web
          path: web/dist
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Linux packaging: tar.gz, deb, rpm, AppImage (x64 + arm64)
  # ---------------------------------------------------------------
  package-linux:
    name: Package Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: native
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  nfpm_arch: amd64 }
          - { arch: aarch64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, nfpm_arch: arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: blendcraft-${{ matrix.target }}
          path: in

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Prepare files
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          mkdir -p stage dist/packaging
          cp "in/${BIN}-${{ matrix.target }}" "stage/${BIN}"
          chmod +x "stage/${BIN}"

          cat > stage/blendcraft.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=BlendCraft
          Comment=BlendCraft 3D
          Exec=${BIN}
          Icon=blendcraft
          Categories=Graphics;3DGraphics;
          Terminal=false
          EOF
          sed -i 's/^          //' stage/blendcraft.desktop

          # Placeholder icon. Drop your own at packaging/icons/blendcraft.svg to override.
          if [[ -f packaging/icons/blendcraft.svg ]]; then
            cp packaging/icons/blendcraft.svg stage/blendcraft.svg
          else
            cat > stage/blendcraft.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="24" fill="#f5792a"/><path d="M64 24 100 44v40L64 104 28 84V44z" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round"/></svg>
          EOF
            sed -i 's/^          //' stage/blendcraft.svg
          fi

      - name: Tarball
        run: |
          set -euxo pipefail
          D="BlendCraft-linux-${{ matrix.arch }}"
          mkdir -p "$D"
          cp stage/* "$D/"
          [[ -f README.md ]] && cp README.md "$D/" || true
          [[ -f LICENSE* ]] && cp LICENSE* "$D/" || true
          tar -czf "dist/packaging/${D}.tar.gz" "$D"

      - name: Package tree
        run: |
          set -euxo pipefail
          install -Dm755 "stage/${BIN}"          "pkgroot/usr/bin/${BIN}"
          install -Dm644 stage/blendcraft.desktop "pkgroot/usr/share/applications/blendcraft.desktop"
          install -Dm644 stage/blendcraft.svg     "pkgroot/usr/share/icons/hicolor/scalable/apps/blendcraft.svg"

      - name: .deb package (dpkg-deb)
        run: |
          set -euxo pipefail
          rm -rf debroot
          cp -a pkgroot debroot
          mkdir -p debroot/DEBIAN
          cat > debroot/DEBIAN/control <<EOF
          Package: blendcraft
          Version: ${VERSION}
          Section: graphics
          Priority: optional
          Architecture: ${{ matrix.nfpm_arch }}
          Maintainer: DaikoGames <noreply@users.noreply.github.com>
          Depends: libx11-6, libxkbcommon0, libwayland-client0
          Recommends: libvulkan1, libgl1
          Homepage: https://github.com/${GITHUB_REPOSITORY}
          Description: BlendCraft 3D
           BlendCraft 3D editor.
          EOF
          dpkg-deb --root-owner-group --build debroot \
            "dist/packaging/blendcraft_${VERSION}_${{ matrix.nfpm_arch }}.deb"
          dpkg-deb --info "dist/packaging/blendcraft_${VERSION}_${{ matrix.nfpm_arch }}.deb"

      - name: Arch Linux package (.pkg.tar.zst)
        run: |
          set -euxo pipefail
          sudo apt-get install -y zstd || true
          cat > pkgroot/.PKGINFO <<EOF
          pkgname = blendcraft
          pkgbase = blendcraft
          pkgver = ${VERSION}-1
          pkgdesc = BlendCraft 3D
          url = https://github.com/${GITHUB_REPOSITORY}
          builddate = $(date +%s)
          packager = DaikoGames
          size = $(du -sb pkgroot/usr | cut -f1)
          arch = ${{ matrix.arch }}
          license = custom
          depend = libx11
          depend = libxkbcommon
          optdepend = vulkan-icd-loader: Vulkan rendering
          EOF
          (cd pkgroot && tar --owner=0 --group=0 --numeric-owner --zstd \
            -cf "$GITHUB_WORKSPACE/dist/packaging/blendcraft-${VERSION}-1-${{ matrix.arch }}.pkg.tar.zst" \
            .PKGINFO usr)
          tar --zstd -tf "dist/packaging/blendcraft-${VERSION}-1-${{ matrix.arch }}.pkg.tar.zst"

      - name: AppImage
        continue-on-error: true
        run: |
          set -euxo pipefail
          A="${{ matrix.arch }}"
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${A}.AppImage"
          chmod +x appimagetool

          mkdir -p AppDir/usr/bin
          cp "stage/${BIN}" AppDir/usr/bin/
          cp stage/blendcraft.desktop stage/blendcraft.svg AppDir/
          ln -sf "usr/bin/${BIN}" AppDir/AppRun

          ARCH="$A" APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool AppDir "dist/packaging/BlendCraft-linux-${A}.AppImage"

      - name: Install nfpm (for .rpm)
        continue-on-error: true
        run: |
          set -euxo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          cat > nfpm.yaml <<EOF
          name: blendcraft
          arch: ${{ matrix.nfpm_arch }}
          platform: linux
          version: ${VERSION}
          section: graphics
          maintainer: DaikoGames
          description: BlendCraft 3D
          homepage: https://github.com/${GITHUB_REPOSITORY}
          contents:
            - src: stage/${BIN}
              dst: /usr/bin/${BIN}
              file_info: { mode: 0755 }
            - src: stage/blendcraft.desktop
              dst: /usr/share/applications/blendcraft.desktop
            - src: stage/blendcraft.svg
              dst: /usr/share/icons/hicolor/scalable/apps/blendcraft.svg
          overrides:
            rpm:
              depends: [libxkbcommon, libX11]
          EOF
          cat nfpm.yaml

      - name: .rpm package
        continue-on-error: true
        run: nfpm package -p rpm -t dist/packaging/

      - name: List output
        run: ls -lah dist/packaging

      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-packages-linux-${{ matrix.arch }}
          path: dist/packaging/*
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Flatpak (x64) - plain runner, no docker container (the container
  # caused "Invalid cross-device link" when updating runtimes)
  # ---------------------------------------------------------------
  package-flatpak:
    name: Package Flatpak
    runs-on: ubuntu-24.04
    needs: native
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: blendcraft-x86_64-unknown-linux-gnu
          path: in

      - name: Generate manifest
        shell: bash
        run: |
          set -euxo pipefail
          APP=io.github.DaikoGames.BlendCraft
          mkdir -p flatpak-build
          cp "in/${BIN}-x86_64-unknown-linux-gnu" "flatpak-build/${BIN}"

          cat > "flatpak-build/${APP}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=BlendCraft
          Comment=BlendCraft 3D
          Exec=${BIN}
          Icon=${APP}
          Categories=Graphics;3DGraphics;
          Terminal=false
          EOF

          if [[ -f packaging/icons/blendcraft.svg ]]; then
            cp packaging/icons/blendcraft.svg "flatpak-build/${APP}.svg"
          else
            cat > "flatpak-build/${APP}.svg" <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="24" fill="#f5792a"/><path d="M64 24 100 44v40L64 104 28 84V44z" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round"/></svg>
          EOF
          fi

          cat > "flatpak-build/${APP}.yml" <<EOF
          app-id: ${APP}
          runtime: org.freedesktop.Platform
          runtime-version: '25.08'
          sdk: org.freedesktop.Sdk
          command: ${BIN}
          finish-args:
            - --share=ipc
            - --share=network
            - --socket=x11
            - --socket=wayland
            - --socket=fallback-x11
            - --device=dri
            - --socket=pulseaudio
            - --filesystem=home
          modules:
            - name: blendcraft
              buildsystem: simple
              build-commands:
                - install -Dm755 ${BIN} /app/bin/${BIN}
                - install -Dm644 ${APP}.desktop /app/share/applications/${APP}.desktop
                - install -Dm644 ${APP}.svg /app/share/icons/hicolor/scalable/apps/${APP}.svg
              sources:
                - { type: file, path: ${BIN} }
                - { type: file, path: ${APP}.desktop }
                - { type: file, path: ${APP}.svg }
          EOF
          cat "flatpak-build/${APP}.yml"

      - name: Install flatpak tooling + runtime
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build flatpak
        run: |
          set -euxo pipefail
          APP=io.github.DaikoGames.BlendCraft
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --default-branch=master --repo=repo build-dir "flatpak-build/${APP}.yml"
          flatpak build-bundle repo BlendCraft-linux-x86_64.flatpak "${APP}" master

      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-packages-flatpak
          path: BlendCraft-linux-x86_64.flatpak
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Snap (x64)
  # ---------------------------------------------------------------
  package-snap:
    name: Package Snap
    runs-on: ubuntu-22.04
    needs: native
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: blendcraft-x86_64-unknown-linux-gnu
          path: in

      - name: Generate snapcraft.yaml
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi

          mkdir -p snapbuild/snap snapbuild/app/bin
          cp "in/${BIN}-x86_64-unknown-linux-gnu" "snapbuild/app/bin/${BIN}"
          chmod +x "snapbuild/app/bin/${BIN}"

          cat > snapbuild/snap/snapcraft.yaml <<EOF
          name: blendcraft
          base: core22
          version: '${VERSION}'
          summary: BlendCraft 3D
          description: BlendCraft 3D editor.
          grade: stable
          confinement: strict
          architectures:
            - build-on: amd64
          apps:
            blendcraft:
              command: bin/${BIN}
              extensions: [gnome]
              plugs: [home, network, opengl, audio-playback, removable-media]
          parts:
            app:
              plugin: dump
              source: app
              stage-packages: [libx11-6, libxkbcommon0, libwayland-client0]
          EOF
          sed -i 's/^          //' snapbuild/snap/snapcraft.yaml

      - uses: snapcore/action-build@v1
        id: snap
        with:
          path: snapbuild

      - name: Rename
        run: |
          mkdir -p dist/packaging
          cp "${{ steps.snap.outputs.snap }}" dist/packaging/BlendCraft-linux-x86_64.snap

      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-packages-snap
          path: dist/packaging/*
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Windows packaging: portable zip + installer (x64, x86, arm64)
  # ---------------------------------------------------------------
  package-windows:
    name: Package Windows (${{ matrix.arch }})
    runs-on: windows-latest
    needs: native
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   target: x86_64-pc-windows-msvc,  allowed: "x64compatible", in64: "x64compatible" }
          - { arch: x86,   target: i686-pc-windows-msvc,    allowed: "",              in64: "" }
          - { arch: arm64, target: aarch64-pc-windows-msvc, allowed: "arm64",         in64: "arm64" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: blendcraft-${{ matrix.target }}
          path: in

      - name: Portable ZIP + Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $ver = $env:GITHUB_REF -replace "refs/tags/v","" }
          else { $ver = "0.0.$($env:GITHUB_RUN_NUMBER)" }

          New-Item -ItemType Directory -Force -Path dist/packaging, stage | Out-Null
          Copy-Item "in/forge3d-${{ matrix.target }}.exe" "stage/forge3d.exe"

          # Portable zip
          Compress-Archive -Path "stage/forge3d.exe" -DestinationPath "dist/packaging/BlendCraft-windows-${{ matrix.arch }}.zip" -Force

          # Installer (Inno Setup)
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }

          $iss = @'
          [Setup]
          AppId={{B1E7DC4A-5D0A-4C55-9F0B-BC0000000001}
          AppName=BlendCraft
          AppVersion=@VER@
          AppPublisher=DaikoGames
          DefaultDirName={autopf}\BlendCraft
          DefaultGroupName=BlendCraft
          OutputDir=@OUT@
          OutputBaseFilename=BlendCraft-setup-@ARCH@
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=@ALLOWED@
          ArchitecturesInstallIn64BitMode=@IN64@
          PrivilegesRequiredOverridesAllowed=dialog
          UninstallDisplayIcon={app}\forge3d.exe

          [Files]
          Source: "@SRC@"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\BlendCraft"; Filename: "{app}\forge3d.exe"
          Name: "{autodesktop}\BlendCraft"; Filename: "{app}\forge3d.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"

          [Run]
          Filename: "{app}\forge3d.exe"; Description: "Launch BlendCraft"; Flags: nowait postinstall skipifsilent
          '@

          $iss = $iss.Replace('@VER@', $ver).
                      Replace('@ARCH@', '${{ matrix.arch }}').
                      Replace('@ALLOWED@', '${{ matrix.allowed }}').
                      Replace('@IN64@', '${{ matrix.in64 }}').
                      Replace('@SRC@', (Resolve-Path 'stage/forge3d.exe').Path).
                      Replace('@OUT@', (Resolve-Path 'dist/packaging').Path)
          Set-Content -Path installer.iss -Value $iss -Encoding UTF8

          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

          Get-ChildItem dist/packaging

      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-packages-windows-${{ matrix.arch }}
          path: dist/packaging/*
          if-no-files-found: error

  # ---------------------------------------------------------------
  # macOS packaging
  # ---------------------------------------------------------------
  package-macos:
    name: Package macOS
    runs-on: macos-latest
    needs: macos-universal
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: blendcraft-universal-apple-darwin
          path: in

      - name: Create DMG
        run: |
          mkdir -p dist
          cp in/forge3d-universal-apple-darwin dist/forge3d-universal-apple-darwin
          chmod +x dist/forge3d-universal-apple-darwin
          bash packaging/macos/build-app-dmg.sh dist/packaging

      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-packages-macos
          path: dist/packaging/*
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Web packaging
  # ---------------------------------------------------------------
  package-web:
    name: Package Web
    runs-on: ubuntu-latest
    needs: web
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: blendcraft-web
          path: web/dist

      - name: Create Web ZIP
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/packaging"
          bash packaging/web/build-zip.sh "$GITHUB_WORKSPACE/dist/packaging"
          ls -la "$GITHUB_WORKSPACE/dist/packaging"

      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-packages-web
          path: dist/packaging/*
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------
  release:
    name: GitHub Release (everything)

    # Runs when:
    #  - a v* tag is pushed
    #  - a push to main happens (auto pre-release, tagged v0.0.0-ci-N)
    #  - workflow_dispatch with create_release ticked
    # always() prevents skipped/failed experimental + packaging jobs
    # from automatically skipping this job.
    if: >-
      always() &&
      needs.native.result == 'success' &&
      needs.web.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
      )

    needs:
      - native
      - macos-universal
      - cross
      - bsd-extra
      - web
      - package-linux
      - package-flatpak
      - package-snap
      - package-windows
      - package-macos
      - package-web

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          echo "=== Available artifacts ==="
          find artifacts -type f | sort || true

          # -------------------------------------------------------
          # Collect binaries
          # -------------------------------------------------------
          find artifacts -type f -name 'forge3d*' -print0 |
          while IFS= read -r -d '' file; do
            cp "$file" release/
          done

          # -------------------------------------------------------
          # Collect packages
          # -------------------------------------------------------
          find artifacts -type f \( \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.pkg.tar.zst' -o \
            -name '*.dmg' -o \
            -name '*.flatpak' -o \
            -name '*.snap' -o \
            -name '*.msi' -o \
            -name '*.exe' -o \
            -name '*.zip' -o \
            -name '*.tar.gz' \
          \) -print0 |
          while IFS= read -r -d '' file; do
            cp -n "$file" release/ || true
          done

          # -------------------------------------------------------
          # Package Web build as ZIP
          # -------------------------------------------------------
          if [[ -d artifacts/blendcraft-web ]]; then
            (cd artifacts/blendcraft-web &&
              zip -qr "$GITHUB_WORKSPACE/release/BlendCraft-web.zip" .)
          fi

          (cd release && sha256sum * > SHA256SUMS.txt)

          echo "=== Release files ==="
          ls -lah release/

          test -n "$(ls -A release)"

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -e
          PRERELEASE=false

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"

          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"

          else
            TAG="v0.0.0-ci-${GITHUB_RUN_NUMBER}"
            PRERELEASE=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG (prerelease=$PRERELEASE)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BlendCraft ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
