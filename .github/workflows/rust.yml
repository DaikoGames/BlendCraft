name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN: forge3d   # binary produced by crates/desktop (package: forge-desktop)

jobs:
  # ---------------------------------------------------------------- native runners
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x64",     os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  ext: "" }
          - { name: "Linux ARM64",   os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { name: "Windows x64",   os: windows-latest,   target: x86_64-pc-windows-msvc,    ext: ".exe" }
          - { name: "Windows x86",   os: windows-latest,   target: i686-pc-windows-msvc,      ext: ".exe" }
          - { name: "Windows ARM64", os: windows-latest,   target: aarch64-pc-windows-msvc,   ext: ".exe" }
          - { name: "macOS ARM64",   os: macos-latest,     target: aarch64-apple-darwin,      ext: "" }
          - { name: "macOS x64",     os: macos-latest,     target: x86_64-apple-darwin,       ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Build
        run: cargo build --release -p forge-desktop --target ${{ matrix.target }}
      - name: Test core
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test -p forge-core
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN}${{ matrix.ext }}" "dist/${BIN}-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-${{ matrix.target }}
          path: dist/*

  # ---------------------------------------------------------------- cross (via `cross`)
  cross:
    name: ${{ matrix.name }} (cross)
    runs-on: ubuntu-latest
    continue-on-error: true   # exotic targets must not block the others
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86",   target: i686-unknown-linux-gnu }
          - { name: "Linux ARMv7", target: armv7-unknown-linux-gnueabihf }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build
        run: cross build --release -p forge-desktop --target ${{ matrix.target }}
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN}" "dist/${BIN}-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-${{ matrix.target }}
          path: dist/*

  # ---------------------------------------------------------------- FreeBSD
  freebsd:
    name: FreeBSD x64
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y rust pkgconf gtk3 libX11 libxkbcommon wayland
          run: |
            cargo build --release -p forge-desktop
            mkdir -p dist
            cp target/release/${BIN} dist/${BIN}-x86_64-unknown-freebsd
      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-x86_64-unknown-freebsd
          path: dist/*

  # ---------------------------------------------------------------- Web (WebAssembly)
  web:
    name: Web (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Install wasm-bindgen CLI (must match Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build web app
        run: ./web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: blendcraft-web
          path: web/dist

  # ---------------------------------------------------------------- Release on tag
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, cross, freebsd, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip web build
        run: cd artifacts/blendcraft-web && zip -r ../blendcraft-web.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/forge3d*
            artifacts/blendcraft-web.zip
