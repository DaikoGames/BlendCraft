# Help OpenH264 (source) + other C/C++ deps build under `cross`.
# Each target gets cmake, a C++ compiler and nasm inside the container.

[target.i686-unknown-linux-gnu]
pre-build = [
  "dpkg --add-architecture i386 || true",
  "apt-get update",
  "apt-get install -y cmake g++-multilib nasm pkg-config",
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
  "apt-get update",
  "apt-get install -y cmake g++-aarch64-linux-gnu nasm pkg-config",
]

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
  "apt-get update",
  "apt-get install -y cmake g++-arm-linux-gnueabihf nasm pkg-config",
]

[target.riscv64gc-unknown-linux-gnu]
pre-build = [
  "apt-get update",
  "apt-get install -y cmake g++-riscv64-linux-gnu nasm pkg-config || apt-get install -y cmake g++ nasm pkg-config",
]
