[workspace]
resolver = "2"
members = ["crates/core", "crates/io", "crates/render", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.29", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "=22.1.0"
winit = "0.30"
pollster = "0.3"
gltf = "1"
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1.3"
flate2 = "1"
tobj = "4"
ttf-parser = "0.25"
lyon = "1.0"
rfd = "0.15"
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = { version = "0.29", default-features = false }
half = "2"
image = { version = "0.25", default-features = false, features = ["hdr", "png", "jpeg"] }
log = "0.4"
ureq = "2"
env_logger = "0.11"
console_error_panic_hook = "0.1"
console_log = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "console",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Window",
] }
forge-core = { path = "crates/core" }
forge-io = { path = "crates/io" }
forge-render = { path = "crates/render" }

[profile.release]
lto = "thin"
codegen-units = 1
