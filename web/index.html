<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="description" content="BlendCraft — open-source 3D creation suite running in the browser" />
  <title>BlendCraft</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a1e;
      color: #e8e8ec;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 1000;
      background: #1a1a1e;
      transition: opacity 0.4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    #loading p { color: #9a9aa8; font-size: 0.95rem; max-width: 28rem; text-align: center; }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #3a3a48;
      border-top-color: #6c8cff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.75rem;
      padding: 2rem;
      background: #1a1a1e;
      z-index: 1001;
      text-align: center;
    }
    #error.visible { display: flex; }
    #error h2 { color: #ff6b6b; font-size: 1.25rem; }
    #error pre {
      background: #121216;
      border: 1px solid #2a2a32;
      border-radius: 6px;
      padding: 1rem;
      max-width: 90vw;
      overflow: auto;
      font-size: 0.8rem;
      color: #ccc;
      text-align: left;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner" aria-hidden="true"></div>
    <h1>BlendCraft</h1>
    <p>Loading WebAssembly application…</p>
    <p id="status" style="font-size:0.8rem;color:#6a6a78"></p>
  </div>
  <div id="error">
    <h2>Failed to start BlendCraft</h2>
    <p>Your browser may lack WebGPU / WebGL2 support, or the WASM module could not be loaded.</p>
    <pre id="error-detail"></pre>
  </div>
  <!-- winit / wgpu look for a canvas with this id by convention when no canvas is
       explicitly attached via WindowAttributes on the web backend. -->
  <canvas id="blendcraft-canvas" tabindex="0"></canvas>

  <script type="module">
    const loading = document.getElementById("loading");
    const statusEl = document.getElementById("status");
    const errorBox = document.getElementById("error");
    const errorDetail = document.getElementById("error-detail");

    function setStatus(msg) {
      if (statusEl) statusEl.textContent = msg;
    }

    function showError(err) {
      loading.classList.add("hidden");
      errorBox.classList.add("visible");
      errorDetail.textContent = (err && err.stack) ? err.stack : String(err);
      console.error(err);
    }

    async function start() {
      try {
        setStatus("Fetching WASM module…");
        // The packaged build places the wasm-bindgen JS glue next to this HTML.
        const init = await import("./forge_app.js");
        setStatus("Compiling / instantiating WASM…");
        // wasm-bindgen default export is an async init function.
        await init.default();
        setStatus("Application started");
        // Give the first frame a moment to paint before hiding the splash.
        requestAnimationFrame(() => {
          setTimeout(() => loading.classList.add("hidden"), 150);
        });
      } catch (e) {
        showError(e);
      }
    }

    // Catch unhandled rejections from the WASM runtime.
    window.addEventListener("unhandledrejection", (ev) => {
      showError(ev.reason || "Unhandled promise rejection");
    });

    start();
  </script>
</body>
</html>
